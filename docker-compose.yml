# McpMailGuard as a long-running MCP server for an agent (e.g. OpenClaw) running in another
# container on the same host. The agent reaches it at http://mailguard:8080/mcp over a shared
# Docker network; no port is published on the host.
#
# One-time setup:
#   cp .env.example .env                    # fill in the account, API key and OPENCLAW_NETWORK
#                                           # (e.g. openclaw_default, see `docker network ls`)
#   docker compose build
#   docker compose run --rm mailguard login hotmail
#   docker compose up -d

services:
  mailguard:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-mailguard:latest
    container_name: mailguard
    restart: unless-stopped
    env_file: .env
    volumes:
      # Saved sign-ins and token caches. Keep this volume private; it grants read access to your mail.
      - mailguard-data:/data
    networks:
      - agents
    # Defense in depth.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  mailguard-data:

networks:
  agents:
    external: true
    name: ${OPENCLAW_NETWORK:-openclaw}

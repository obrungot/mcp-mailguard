name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: McpMailGuard/McpMailGuard.csproj

      - name: Restore
        run: dotnet restore McpMailGuard/McpMailGuard.csproj

      - name: Build
        run: dotnet build McpMailGuard/McpMailGuard.csproj -c Release --no-restore

      - name: Test
        run: |
          if find . -name '*Tests.csproj' -not -path '*/bin/*' -not -path '*/obj/*' | grep -q .; then
            dotnet test -c Release --no-build
          else
            echo "No test projects found — skipping tests."
          fi

  license:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify LICENSE file
        run: |
          test -f LICENSE || { echo "::error::LICENSE file is missing"; exit 1; }
          grep -q "MIT License" LICENSE || { echo "::error::LICENSE does not contain an MIT license"; exit 1; }
          echo "LICENSE found and is MIT."

      - name: Verify SPDX headers on source files
        run: |
          missing=0
          while IFS= read -r f; do
            if ! head -n 5 "$f" | grep -q "SPDX-License-Identifier: MIT"; then
              echo "::error file=$f::Missing 'SPDX-License-Identifier: MIT' header"
              missing=1
            fi
          done < <(git ls-files '*.cs')
          if [ "$missing" -ne 0 ]; then
            echo "One or more source files are missing an SPDX license header."
            exit 1
          fi
          echo "All source files carry an SPDX license header."

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mcp-mailguard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
